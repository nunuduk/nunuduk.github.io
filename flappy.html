<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy — Nguyen Nguyen</title>
  <script>(function(){var p=document.location.pathname;var d=p.replace(/\/[^/]*$/,'/')||'/';var b=document.createElement('base');b.href=d;document.head.insertBefore(b,document.head.firstChild);})();</script>
  <link rel="icon" href="assets/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <!-- Inter: fetched alongside the stylesheet and applied when it arrives, so it never holds up the scripts
       (and the landing sweep) the way an @import inside style.css did -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
  <script>!function(){var t=localStorage.getItem('theme');t&&document.documentElement.setAttribute('data-theme',t)}();</script>
  <meta name="description" content="A small flappy-style game.">
</head>
<body>


  <div id="sidebar-root"></div>

  <main class="flappy-page">

    <span class="page-label">flappy.</span>

    <p class="flappy-score-wrap">score <span id="flappy-score" class="flappy-score-num">0</span></p>
    <p class="flappy-hint" id="flappy-hint">click, space, or tap to flap</p>

    <div class="flappy-canvas-wrap">
      <canvas id="flappy-canvas" width="400" height="600" role="img" aria-label="Flappy game"></canvas>
    </div>

  </main>

  <script src="js/sidebar.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/crystals.js"></script>
  <script src="js/pomodoro.js"></script>
  <script src="js/surprise.js"></script>
  <script src="js/flappy.js"></script>
  <script src="js/waveform.js"></script>
  <script src="js/dither.js"></script>
  <script src="js/ritsu100.js"></script>
  <script src="js/holo.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/spa.js"></script>
</body>
</html>
